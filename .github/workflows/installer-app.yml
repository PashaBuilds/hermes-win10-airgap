# Builds the Windows setup assistant (installer-app/, HermesKurulumAsistani.exe) on a real Windows
# runner, runs its unit tests, starts the exe once (UI smoke test + screenshot) and uploads it as an
# artifact. workflow_dispatch with "release_tag" also attaches the exe (+ .sha256) to that existing
# release. Separate from airgap-release.yml on purpose: bundle releases are not touched.
name: Kurulum asistani (installer-app)

on:
  pull_request:
    paths: ['installer-app/**', '.github/workflows/installer-app.yml']
  push:
    branches: [main]
    paths: ['installer-app/**', '.github/workflows/installer-app.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the exe to (e.g. kurulum-asistani-v1.0.0). Empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build + unit tests
        shell: pwsh
        run: ./installer-app/build.ps1 -Test
      - name: UI smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $exe = Resolve-Path installer-app/dist/HermesKurulumAsistani.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/installer-app/dist/smoke.png"); $g.Dispose(); $bmp.Dispose()
          } catch { Write-Warning "screenshot failed: $_" }
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          "window title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HermesKurulumAsistani
          path: installer-app/dist/
      - name: Attach to release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release upload $env:TAG installer-app/dist/HermesKurulumAsistani.exe installer-app/dist/HermesKurulumAsistani.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
